#cloud-config

# Install docker-compose
package_update: true
packages:
  - docker-compose

# Create application directory structure
runcmd:
  # Create directories
  - mkdir -p /opt/analytics/{caddy,data,config}
  - mkdir -p /opt/analytics/caddy/data
  - mkdir -p /opt/analytics/caddy/config
  - mkdir -p /opt/analytics/elroy-docs

  # Write docker-compose.yml
  - echo "${docker_compose_content}" | base64 -d > /opt/analytics/docker-compose.yml

  # Write Caddyfile
  - echo "${caddyfile_content}" | base64 -d > /opt/analytics/caddy/Caddyfile

  # Secrets are uploaded separately with `just bootstrap`; keeping them out of
  # user_data prevents Terraform state from storing the complete application environment.
  - chown -R root:root /opt/analytics

  # Enable docker-compose service restart on boot
  - |
    cat > /etc/systemd/system/analytics.service <<'EOF'
    [Unit]
    Description=Analytics and Newsletter Services
    Requires=docker.service
    After=docker.service
    ConditionPathExists=/opt/analytics/.env

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    WorkingDirectory=/opt/analytics
    ExecStart=/usr/bin/docker-compose up -d
    ExecStop=/usr/bin/docker-compose down

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl enable analytics.service
