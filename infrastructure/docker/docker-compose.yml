services:
  # PostgreSQL database for both Umami and Listmonk
  postgres:
    image: postgres@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Umami Analytics
  umami:
    image: ghcr.io/umami-software/umami@sha256:28f263fe06f79ebffa5a6a6e9bd33b7a278e9342a88e0bdac812416c9f9e4361
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Listmonk Newsletter
  listmonk:
    image: listmonk/listmonk@sha256:179d00d9553c371b6fe88c9b145095d651e275bdd66db46b2e0b79daff316b6f
    container_name: listmonk
    restart: unless-stopped
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${POSTGRES_USER:-postgres}
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_app__smtp_address: ${LISTMONK_app__smtp_address:-smtp.sendgrid.net}
      LISTMONK_app__smtp_port: ${LISTMONK_app__smtp_port:-587}
      LISTMONK_app__smtp_auth_protocol: ${LISTMONK_app__smtp_auth_protocol:-login}
      LISTMONK_app__smtp_username: ${LISTMONK_app__smtp_username:-apikey}
      LISTMONK_app__smtp_password: ${LISTMONK_app__smtp_password}
      LISTMONK_app__smtp_from_address: ${LISTMONK_app__smtp_from_address}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics_network
    command: ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy@sha256:fce4f15aad23222c0ac78a1220adf63bae7b94355d5ea28eee53910624acedfa
    container_name: caddy
    restart: unless-stopped
    environment:
      CADDY_ADMIN_USER: ${CADDY_ADMIN_USER:-admin}
      CADDY_ADMIN_PASSWORD_HASH: ${CADDY_ADMIN_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./elroy-docs:/srv/elroy-docs:ro
      - ./blog-preview:/srv/blog-preview:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - analytics_network
    depends_on:
      - umami
      - listmonk

networks:
  analytics_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
